version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    reviewers:
      - "jossmoff"
    commit-message:
      prefix: "chore(dep):"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    reviewers:
      - "jossmoff"
    commit-message:
      prefix: "chore(dep):"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
